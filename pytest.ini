[pytest]
testpaths = tests
addopts = -v --html=reports/report.html --self-contained-html --reruns 1 --reruns-delay 3
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
markers =
    auth: tests that require the test account (skipped when credentials are not set)
    smoke: fast checks of the main flows
    negative: negative scenarios (invalid input)
    navigation: website navigation scenarios
    games: casino game scenarios (demo mode only)
    functional: additional functionality scenarios
    e2e: complete user journey
